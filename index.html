<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Jardines del Renacer</title><link rel="icon" href="logo-jr.png">
<style>
:root{--bg:#e9edf5;--card:#fff;--ink:#1c2340;--mut:#6b7392;--pri:#3b3fa0;--line:#dde2ee;--ok:#1f9d6b;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#141829;--card:#1d2238;--ink:#e8ebf7;--mut:#98a0c0;--pri:#7c82ee;--line:#2e3555}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit;color:inherit}.hide{display:none!important}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.s{padding:5px 10px;font-size:12px}.btn.r{background:var(--bad)}
input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:600}
.box{max-width:380px;margin:9vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center}
.box img{width:72px}.box h2{margin:8px 0 2px}.box p{color:var(--mut);margin:0 0 8px}.box form{text-align:left}.box .btn{width:100%;margin-top:16px}
.err{color:var(--bad);font-size:12px;min-height:16px;margin-top:8px}
#shell{display:grid;grid-template-columns:230px 1fr;grid-template-rows:56px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line)}
header img{width:32px}header b{font-size:16px}header small{color:var(--mut);display:block}.sp{flex:1}
.tag{background:color-mix(in srgb,var(--pri) 15%,transparent);color:var(--pri);border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700}
nav{background:var(--card);border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
nav h6{margin:14px 10px 4px;font-size:11px;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
nav a{display:block;padding:9px 12px;border-radius:8px;cursor:pointer}nav a:hover{background:var(--bg)}nav a.on{background:color-mix(in srgb,var(--pri) 16%,transparent);color:var(--pri);font-weight:700}
main{overflow:auto;padding:24px;position:relative}main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
h1{margin:0 0 4px}.sub{color:var(--mut);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.app{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;transition:.15s}.app:hover{transform:translateY(-2px);border-color:var(--pri)}
.app .ic{font-size:28px}.app h3{margin:8px 0 4px}.app p{margin:0 0 10px;color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:11px;text-transform:uppercase;color:var(--mut)}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
#modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.mc{background:var(--card);border-radius:14px;padding:22px;width:560px;max-width:100%;max-height:92vh;overflow:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.acc{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:8px}.acc input[type=checkbox]{width:auto}.acc span{flex:1}.acc select{width:150px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:20}
@media(max-width:760px){#shell{grid-template-columns:1fr;grid-template-rows:56px auto 1fr}header{grid-column:1}nav{display:flex;gap:4px;overflow-x:auto;padding:6px}nav h6{display:none}nav a{white-space:nowrap}main{padding:14px}}
</style></head><body>

<div id="v-setup" class="box hide"><img src="logo-jr.png" alt=""><h2>Primera configuración</h2><p>Crea la cuenta del administrador del portal.</p>
<form id="f-setup"><label>Nombre completo</label><input name="nombre" required><label>Usuario</label><input name="usuario" required autocomplete="username">
<label>Clave (mín. 8 caracteres)</label><input name="clave" type="password" minlength="8" required autocomplete="new-password"><div class="err" id="e-setup"></div><button class="btn">Crear administrador</button></form></div>

<div id="v-login" class="box hide"><img src="logo-jr.png" alt=""><h2>Jardines del Renacer</h2><p>Ingresa con tu usuario único</p>
<form id="f-login"><label>Usuario o correo</label><input name="usuario" required autocomplete="username"><label>Clave</label><input name="clave" type="password" required autocomplete="current-password">
<div class="err" id="e-login"></div><button class="btn">Entrar</button></form></div>

<div id="shell" class="hide">
<header><img src="logo-jr.png" alt=""><div><b>Portal Jardines del Renacer</b><small>Tu oficina de trabajo</small></div><span class="sp"></span>
<div style="text-align:right"><b id="h-name"></b><small id="h-user"></small></div><span class="tag" id="h-rol"></span><button class="btn o s" onclick="logout()">Cerrar sesión</button></header>
<nav id="nav"></nav><main id="main"></main></div>
<div id="modal" class="hide"></div><div id="toast" class="hide"></div>

<script>
/* ============ CONFIGURACIÓN ============ */
const PORTAL_CONFIG = {
  GAS_URL: = 'https://script.google.com/macros/s/AKfycbzqHHvFyCbS-s1PHXFG6qdxZCxnWalG5eg_GtscpntJ4w2U11tNEOca-QwTHnyg_YvKYw/exec';
// Catálogo de aplicaciones. Para sumar una app nueva: agrega un objeto aquí y su carpeta en /apps/.
const APPS = [
  {id:'cafeteria',  nombre:'Cafetería Regional Quindío', icono:'☕', url:'apps/cafeteria/index.html',  desc:'Registro, liquidación y control de gastos de cafetería por sede.', roles:['ADMINISTRADOR','COORDINADOR','SEDE']},
  {id:'ss_diarios', nombre:'Control diario de Ss',       icono:'📊', url:'apps/ss-diarios/index.html', desc:'Análisis y tabla de control de servicios diarios.',               roles:['EDITOR','LECTOR']},
];
const SEDES=['Armenia','Calarcá','Circasia','Córdoba','Génova','La Tebaida','Montenegro','Pijao','Quimbaya','Barcelona'];

/* ============ API (Apps Script o modo local) ============ */
const $=s=>document.querySelector(s), esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SK='jr_portal_session', LK='jr_portal_users';
let ses=null,cur='home';
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const lu=()=>JSON.parse(localStorage.getItem(LK)||'[]'), su=l=>localStorage.setItem(LK,JSON.stringify(l));
const pub=({salt,hash,...u})=>u;
const allAccess=()=>Object.fromEntries(APPS.map(a=>[a.id,a.roles[0]]));
async function remote(p){const r=await fetch(PORTAL_CONFIG.GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});const j=await r.json();if(j.error)throw new Error(j.error);return j}
async function local(b){
  const L=lu(), find=x=>L.find(u=>u.usuario===x||(u.correo&&u.correo===x));
  const mk=async(o,clave)=>{o.salt=crypto.randomUUID();o.hash=await sha(o.salt+clave);return o};
  switch(b.action){
    case 'status': return {needsSetup:!L.length};
    case 'setup': {if(L.length)throw Error('Ya existe un administrador');const u=await mk({id:1,usuario:b.usuario.toLowerCase().trim(),nombre:b.nombre,correo:'',sede:'',rol:'admin',estado:'activo',accesos:{}},b.clave);su([u]);return {success:true,token:crypto.randomUUID(),user:pub(u)}}
    case 'login': {const u=find(b.usuario.toLowerCase().trim());if(!u||u.hash!==await sha(u.salt+b.clave))throw Error('Usuario o clave incorrectos');if(u.estado!=='activo')throw Error('Usuario inactivo. Contacta al administrador.');return {success:true,token:crypto.randomUUID(),user:pub(u)}}
    case 'listUsers': return {users:L.map(pub)};
    case 'saveUser': {const d=b.user,usuario=d.usuario.toLowerCase().trim();if(L.some(u=>u.usuario===usuario&&u.id!==d.id))throw Error('Ese usuario ya existe');
      let o=d.id&&L.find(u=>u.id===d.id);if(!o){if(!d.clave)throw Error('La clave es obligatoria');o={id:Math.max(0,...L.map(u=>u.id))+1};L.push(o)}
      Object.assign(o,{usuario,nombre:d.nombre,correo:(d.correo||'').toLowerCase(),sede:d.sede||'',rol:d.rol,estado:d.estado,accesos:d.accesos||{}});if(d.clave)await mk(o,d.clave);su(L);return {success:true}}
    case 'deleteUser': {if(b.id===ses.user.id)throw Error('No puedes eliminarte a ti mismo');su(L.filter(u=>u.id!==b.id));return {success:true}}
    case 'changePassword': {const o=L.find(u=>u.id===ses.user.id);if(o.hash!==await sha(o.salt+b.actual))throw Error('La clave actual no coincide');await mk(o,b.nueva);su(L);return {success:true}}
  }
}
const api=(action,p={})=>(PORTAL_CONFIG.GAS_URL?remote:local)({action,token:ses?.token,...p});

/* ============ Sesión ============ */
function start(r){
  const u=r.user; if(u.rol==='admin')u.accesos=allAccess();
  ses={token:r.token,user:u,exp:Date.now()+6*3600e3}; localStorage.setItem(SK,JSON.stringify(ses)); show();
}
function logout(){localStorage.removeItem(SK);ses=null;location.reload()}
const myApps=()=>APPS.filter(a=>ses.user.accesos[a.id]);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),2600)}
async function boot(){
  try{ses=JSON.parse(localStorage.getItem(SK))}catch(e){}
  if(ses&&ses.exp>Date.now())return show();
  localStorage.removeItem(SK);ses=null;
  try{(await api('status')).needsSetup?$('#v-setup').classList.remove('hide'):$('#v-login').classList.remove('hide')}
  catch(e){$('#v-login').classList.remove('hide');$('#e-login').textContent='No hay conexión con el servidor: '+e.message}
}
const form=(id,err,fn)=>$(id).addEventListener('submit',async e=>{e.preventDefault();$(err).textContent='';try{await fn(Object.fromEntries(new FormData(e.target)))}catch(x){$(err).textContent=x.message}});
form('#f-setup','#e-setup',async d=>start(await api('setup',d)));
form('#f-login','#e-login',async d=>start(await api('login',d)));

/* ============ Interfaz ============ */
function show(){
  ['#v-setup','#v-login'].forEach(s=>$(s).classList.add('hide'));$('#shell').classList.remove('hide');
  const u=ses.user;$('#h-name').textContent=u.nombre;$('#h-user').textContent=u.usuario;$('#h-rol').textContent=u.rol==='admin'?'Administrador':'Usuario';
  const adm=u.rol==='admin';
  $('#nav').innerHTML=`<h6>Mi espacio</h6><a data-v="home">🏢 Oficina</a><h6>Mis aplicaciones</h6>`+
    (myApps().map(a=>`<a data-v="${a.id}">${a.icono} ${esc(a.nombre)}</a>`).join('')||'<a style="color:var(--mut);cursor:default">Sin aplicaciones asignadas</a>')+
    (adm?`<h6>Administración</h6><a data-v="users">👥 Usuarios y accesos</a>`:'')+`<h6>Cuenta</h6><a data-v="perfil">🔑 Mi cuenta</a>`;
  $('#nav').onclick=e=>{const v=e.target.closest('a')?.dataset.v;v&&go(v)};
  go(location.hash.slice(1)||'home');
}
function go(v){
  if(v==='users'&&ses.user.rol!=='admin')v='home';
  if(APPS.some(a=>a.id===v)&&!ses.user.accesos[v])v='home';
  cur=v;location.hash=v;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  const m=$('#main'),app=APPS.find(a=>a.id===v);
  if(app){m.style.padding=0;m.innerHTML=`<iframe src="${app.url}" title="${esc(app.nombre)}"></iframe>`;return}
  m.style.padding='';({home,users,perfil}[v]||home)();
}
function home(){
  const l=myApps();$('#main').innerHTML=`<h1>Oficina</h1><p class="sub">Hola, ${esc(ses.user.nombre)}. Estas son las aplicaciones a las que tienes acceso.</p>`+
  (l.length?`<div class="grid">${l.map(a=>`<div class="app" onclick="go('${a.id}')"><div class="ic">${a.icono}</div><h3>${esc(a.nombre)}</h3><p>${esc(a.desc)}</p><span class="tag">${esc(ses.user.accesos[a.id])}</span></div>`).join('')}</div>`
  :`<p>Aún no tienes aplicaciones asignadas. Pídele acceso al administrador.</p>`);
}
function perfil(){
  $('#main').innerHTML=`<h1>Mi cuenta</h1><p class="sub">${esc(ses.user.nombre)} · ${esc(ses.user.usuario)}</p><div class="mc" style="max-width:380px;border:1px solid var(--line)"><form id="f-pw"><b>Cambiar clave</b>
  <label>Clave actual</label><input name="actual" type="password" required><label>Nueva clave (mín. 8)</label><input name="nueva" type="password" minlength="8" required><div class="err" id="e-pw"></div><button class="btn" style="margin-top:12px">Guardar</button></form></div>`;
  form('#f-pw','#e-pw',async d=>{await api('changePassword',d);$('#f-pw').reset();toast('Clave actualizada')});
}
let USERS=[];
async function users(){
  const m=$('#main');m.innerHTML='<p>Cargando…</p>';
  try{USERS=(await api('listUsers')).users}catch(e){m.innerHTML=`<p class="err">${esc(e.message)}</p>`;return}
  m.innerHTML=`<div style="display:flex;align-items:center"><div style="flex:1"><h1>Usuarios y accesos</h1><p class="sub">Crea usuarios y decide a qué aplicaciones entra cada uno.</p></div><button class="btn" onclick="editUser()">+ Nuevo usuario</button></div>
  <div style="overflow:auto"><table><tr><th>Usuario</th><th>Aplicaciones asignadas</th><th>Estado</th><th></th></tr>${USERS.map(u=>`<tr><td><b>${esc(u.nombre)}</b><br><small style="color:var(--mut)">${esc(u.usuario)}${u.rol==='admin'?' · Administrador':''}</small></td>
  <td>${u.rol==='admin'?'<span class="tag">Todas</span>':Object.entries(u.accesos||{}).map(([k,r])=>`<span class="tag" title="${esc(r)}">${esc((APPS.find(a=>a.id===k)||{nombre:k}).nombre)} · ${esc(r)}</span> `).join('')||'<small style="color:var(--mut)">Ninguna</small>'}</td>
  <td><span class="st" style="background:var(--${u.estado==='activo'?'ok':'bad'})"></span>${esc(u.estado)}</td><td style="white-space:nowrap"><button class="btn o s" onclick="editUser(${u.id})">Editar</button> <button class="btn r s" onclick="delUser(${u.id})">Eliminar</button></td></tr>`).join('')}</table></div>`;
}
function editUser(id){
  const u=USERS.find(x=>x.id===id)||{rol:'usuario',estado:'activo',accesos:{}},a=u.accesos||{};
  $('#modal').innerHTML=`<div class="mc"><h2 style="margin:0 0 6px">${id?'Editar':'Nuevo'} usuario</h2><form id="f-u"><div class="two">
  <div><label>Nombre completo</label><input name="nombre" required value="${esc(u.nombre)}"></div><div><label>Usuario</label><input name="usuario" required value="${esc(u.usuario)}"></div>
  <div><label>Correo</label><input name="correo" type="email" value="${esc(u.correo)}"></div><div><label>${id?'Nueva clave (vacío = no cambiar)':'Clave (mín. 8)'}</label><input name="clave" type="password" minlength="8" ${id?'':'required'} autocomplete="new-password"></div>
  <div><label>Tipo de cuenta</label><select name="rol"><option value="usuario">Usuario</option><option value="admin" ${u.rol==='admin'?'selected':''}>Administrador del portal</option></select></div>
  <div><label>Estado</label><select name="estado"><option>activo</option><option ${u.estado==='inactivo'?'selected':''}>inactivo</option></select></div>
  <div><label>Sede (para rol SEDE en Cafetería)</label><select name="sede"><option value="">—</option>${SEDES.map(s=>`<option ${u.sede===s?'selected':''}>${s}</option>`).join('')}</select></div></div>
  <label>Acceso a aplicaciones (el administrador entra a todas)</label>${APPS.map(p=>`<div class="acc"><input type="checkbox" id="c-${p.id}" ${a[p.id]?'checked':''}><span>${p.icono} ${esc(p.nombre)}</span><select id="r-${p.id}">${p.roles.map(r=>`<option ${a[p.id]===r?'selected':''}>${r}</option>`).join('')}</select></div>`).join('')}
  <div class="err" id="e-u"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button type="button" class="btn o" onclick="$('#modal').classList.add('hide')">Cancelar</button><button class="btn">Guardar</button></div></form></div>`;
  $('#modal').classList.remove('hide');
  form('#f-u','#e-u',async d=>{d.id=id;d.accesos={};APPS.forEach(p=>{if($('#c-'+p.id).checked)d.accesos[p.id]=$('#r-'+p.id).value});
    await api('saveUser',{user:d});$('#modal').classList.add('hide');toast('Usuario guardado');users()});
}
async function delUser(id){if(!confirm('¿Eliminar este usuario? Perderá todos sus accesos.'))return;try{await api('deleteUser',{id});toast('Usuario eliminado');users()}catch(e){toast(e.message)}}
boot();
</script></body></html>
